<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 272" width="256" height="272" role="img" aria-label="lazyrun koala logo">
  <title>lazyrun</title>

  <defs>
    <!-- dream sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#241247"/>
      <stop offset="0.45" stop-color="#6a3d9a"/>
      <stop offset="0.78" stop-color="#c25c9e"/>
      <stop offset="1" stop-color="#ff9a76"/>
    </linearGradient>
    <!-- soft sun halo -->
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffd166" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <!-- glow behind koala -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- surreal background -->
  <rect x="0" y="0" width="256" height="272" rx="46" fill="url(#sky)"/>
  <circle cx="128" cy="148" r="96" fill="url(#sun)"/>
  <circle cx="66" cy="196" r="52" fill="url(#glow)"/>
  <circle cx="196" cy="96" r="44" fill="url(#glow)"/>

  <!-- floating ringed planet -->
  <g opacity="0.95">
    <circle cx="212" cy="62" r="13" fill="#ffd166"/>
    <ellipse cx="212" cy="62" rx="24" ry="7" fill="none" stroke="#fff3c4" stroke-width="2" opacity="0.8" transform="rotate(-20 212 62)"/>
  </g>

  <!-- floating orbs -->
  <circle cx="34" cy="150" r="7" fill="#ffd166" opacity="0.85"/>
  <circle cx="224" cy="150" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="46" cy="96" r="3.5" fill="#ffffff" opacity="0.55"/>
  <circle cx="206" cy="188" r="5" fill="#c25c9e" opacity="0.7"/>

  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M44 37 C44.9 43.3 46.7 45.1 53 46 C46.7 46.9 44.9 48.7 44 55 C43.1 48.7 41.3 46.9 35 46 C41.3 45.1 43.1 43.3 44 37 Z"/>
    <path d="M208 23 C208.7 27.9 210.1 29.3 215 30 C210.1 30.7 208.7 32.1 208 37 C207.3 32.1 205.9 30.7 201 30 C205.9 29.3 207.3 27.9 208 23 Z"/>
    <path d="M30 202 C30.6 206.2 31.8 207.4 36 208 C31.8 208.6 30.6 209.8 30 214 C29.4 209.8 28.2 208.6 24 208 C28.2 207.4 29.4 206.2 30 202 Z"/>
    <path d="M226 206 C226.8 211.6 228.4 213.2 234 214 C228.4 214.8 226.8 216.4 226 222 C225.2 216.4 223.6 214.8 218 214 C223.6 213.2 225.2 211.6 226 206 Z"/>
    <path d="M128 16.5 C128.55 20.35 129.65 21.45 133.5 22 C129.65 22.55 128.55 23.65 128 27.5 C127.45 23.65 126.35 22.55 122.5 22 C126.35 21.45 127.45 20.35 128 16.5 Z"/>
    <path d="M96 189.5 C96.45 192.65 97.35 193.55 100.5 194 C97.35 194.45 96.45 195.35 96 198.5 C95.55 195.35 94.65 194.45 91.5 194 C94.65 193.55 95.55 192.65 96 189.5 Z"/>
  </g>

  <!-- koala -->
  <g>
    <!-- ears -->
    <circle cx="74" cy="72" r="30" fill="#9aa5b1"/>
    <circle cx="74" cy="72" r="16" fill="#d9dee3"/>
    <circle cx="182" cy="72" r="30" fill="#9aa5b1"/>
    <circle cx="182" cy="72" r="16" fill="#d9dee3"/>

    <!-- head -->
    <ellipse cx="128" cy="118" rx="68" ry="62" fill="#a7b2bd"/>

    <!-- eyes -->
    <circle cx="104" cy="110" r="8" fill="#2b2f36"/>
    <circle cx="101.5" cy="107" r="2.6" fill="#ffffff"/>
    <circle cx="152" cy="110" r="8" fill="#2b2f36"/>
    <circle cx="149.5" cy="107" r="2.6" fill="#ffffff"/>

    <!-- nose -->
    <ellipse cx="128" cy="140" rx="16" ry="11" fill="#2b2f36"/>
    <ellipse cx="123" cy="137" rx="4" ry="3" fill="#4b5058"/>

    <!-- mouth -->
    <path d="M128 151 v6 q0 6 -9 6" fill="none" stroke="#2b2f36" stroke-width="3" stroke-linecap="round"/>
    <path d="M128 157 q0 6 9 6" fill="none" stroke="#2b2f36" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="128" y="240" text-anchor="middle"
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1"
        fill="#ffffff">lazyrun</text>
</svg>
